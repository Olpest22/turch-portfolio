<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TURCH — концепция B: «Чертёж»</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@500;700;800&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root { --paper: #efece4; --ink: #15171c; --ink-2: #5b5f67; --line: #2f4a6b; --grid: rgba(47,74,107,.085); --accent: #ff5a1f; --ease: cubic-bezier(.2,.7,.2,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Onest', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: relative; min-height: 100svh; overflow: hidden;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px), linear-gradient(rgba(47,74,107,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(47,74,107,.05) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; background-position: -1px -1px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 26px clamp(16px, 4vw, 56px); }
  .mark { font: 800 20px 'Commissioner'; letter-spacing: .1em; }
  .mark small { font: 500 11px 'JetBrains Mono'; letter-spacing: 0; color: var(--ink-2); margin-left: 12px; }
  .tg { font: 600 15px 'Onest'; color: #fff; background: var(--ink); text-decoration: none; padding: 11px 18px; border-radius: 10px; }
  .grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(24px, 4vw, 64px); align-items: center; padding: 2vh clamp(16px, 4vw, 56px) 40px; min-height: calc(100svh - 92px); }
  h1 { font: 800 clamp(40px, 5.4vw, 84px)/.95 'Commissioner'; letter-spacing: -.035em; margin: 0; }
  h1 em { font-style: normal; color: var(--accent); }
  .lead { margin: 22px 0 0; font-size: clamp(16px, 1.3vw, 19px); line-height: 1.55; color: var(--ink-2); max-width: 30rem; }
  .actions { margin-top: 30px; display: flex; gap: 12px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; height: 52px; padding: 0 24px; border-radius: 12px; font: 600 16px 'Onest'; text-decoration: none; }
  .btn-a { background: var(--accent); color: #1b0a02; }
  .btn-b { box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); }
  .tabs { margin-top: 46px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 30rem; }
  .tab { border: 0; background: none; text-align: left; padding: 10px 0 0; cursor: pointer; font: 500 12px 'JetBrains Mono'; color: var(--ink-2); position: relative; }
  .tab b { display: block; font: 700 15px 'Onest'; color: var(--ink); margin-top: 4px; }
  .tab::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: rgba(21,23,28,.15); }
  .tab i { position: absolute; left: 0; top: 0; height: 2px; width: 0; background: var(--accent); }
  .tab[aria-selected="true"] { color: var(--ink); }

  .board { position: relative; }
  .sheet { position: relative; aspect-ratio: 16 / 10; }
  svg.draw { position: absolute; inset: -9% -7% -12% -7%; width: 114%; height: 121%; overflow: visible; }
  .s { fill: none; stroke: var(--line); stroke-width: 1.4; vector-effect: non-scaling-stroke; stroke-dasharray: var(--len); stroke-dashoffset: var(--len); }
  .on .s { animation: draw 1.3s var(--ease) forwards; animation-delay: calc(var(--d, 0) * 70ms); }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .dim { stroke: var(--accent); stroke-width: 1.2; }
  .lbl { font: 500 26px 'JetBrains Mono'; fill: var(--accent); opacity: 0; transition: opacity .5s; }
  .lbl.ink { fill: var(--line); }
  .on .lbl { opacity: 1; transition-delay: calc(900ms + var(--d, 0) * 120ms); }
  .shot { position: absolute; inset: 0; border-radius: 6px; overflow: hidden; background: center top / cover no-repeat; clip-path: inset(0 0 100% 0); box-shadow: 0 40px 80px -30px rgba(21,23,28,.45); }
  .built .shot { clip-path: inset(0 0 0% 0); transition: clip-path 1.4s cubic-bezier(.65,0,.35,1); }
  .scan { position: absolute; left: -2%; right: -2%; height: 2px; top: 0; background: var(--accent); box-shadow: 0 0 18px var(--accent); opacity: 0; }
  .built .scan { animation: scan 1.4s cubic-bezier(.65,0,.35,1) forwards; }
  @keyframes scan { 0% { top: 0; opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
  .marks { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  .mk { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; background: var(--accent); color: #1b0a02; font: 700 13px 'Onest'; display: grid; place-items: center; box-shadow: 0 0 0 5px rgba(255,90,31,.22); opacity: 0; transform: scale(.4); transition: opacity .35s, transform .5s cubic-bezier(.34,1.56,.64,1); }
  .on .mk { opacity: 1; transform: none; transition-delay: calc(700ms + var(--d) * 160ms); }
  .legend { margin: 78px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; font-size: 14px; color: var(--ink-2); }
  .legend li { display: flex; gap: 10px; align-items: baseline; opacity: 0; transform: translateY(6px); transition: opacity .4s, transform .4s; }
  .on ~ .legend li, .legend.on li { opacity: 1; transform: none; }
  .legend b { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #1b0a02; font: 700 12px 'Onest'; display: grid; place-items: center; }
  .stamp { position: absolute; right: 0; bottom: -10.5%; font: 500 11px 'JetBrains Mono'; color: var(--ink-2); text-align: right; line-height: 1.5; }
  .stamp b { color: var(--ink); font-weight: 500; }
  .fade { transition: opacity .45s; }
  .out .shot, .out svg.draw, .out .stamp { opacity: 0; transition: opacity .45s; }

  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .board { order: -1; margin: 30px 6% 20px; } .legend { grid-template-columns: 1fr; margin-top: 64px; } .stamp { display: none; } }
  @media (prefers-reduced-motion: reduce) { .on .s { animation: none; stroke-dashoffset: 0; } .built .shot { transition: none; } .built .scan { animation: none; } }
</style>
</head>
<body>
<main class="stage">
  <header><div class="mark">TURCH<small>сайты для бизнеса</small></div><a class="tg" href="https://t.me/Turch_I">Написать в Telegram</a></header>
  <div class="grid">
    <section>
      <h1>Сначала чертёж. Потом сайт, который <em>приводит заявки</em>.</h1>
      <p class="lead">Проектирую сайт, как бригада проектирует ремонт: каждый блок на своём месте и работает на заявку.</p>
      <div class="actions"><a class="btn btn-a" href="https://t.me/Turch_I">Обсудить проект</a><a class="btn btn-b" href="/#works">Смотреть работы</a></div>
      <div class="tabs" role="tablist" aria-label="Работы">
        <button class="tab" role="tab" data-i="0">01 · ремонт<b>КЛЮЧ</b><i></i></button>
        <button class="tab" role="tab" data-i="1">02 · потолки<b>Глянец</b><i></i></button>
        <button class="tab" role="tab" data-i="2">03 · мебель<b>Форма и шпон</b><i></i></button>
      </div>
    </section>
    <section class="board" aria-live="polite">
      <div class="sheet" id="sheet">
        <svg class="draw" id="svg" viewBox="-112 -90 1824 1210" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="shot" id="shot"></div>
        <div class="scan"></div>
        <div class="marks" id="marks"></div>
        <div class="stamp" id="stamp"></div>
      </div>
      <ol class="legend" id="legend"></ol>
    </section>
  </div>
</main>
<script>
(() => {
  // Drawing in a 1600×1000 sheet space (matches the 16:10 screenshot).
  const SITES = [
    { img: '/shots/remont-hero.webp', name: 'КЛЮЧ — ремонт квартир', notes: [['Первый экран из глав-этапов ремонта', 5, 48], ['Кнопка ведёт в калькулятор сметы', 52, 82], ['Заявка на замер уходит в Telegram', 92, 8]] },
    { img: '/shots/potolki-hero.webp', name: 'Глянец — натяжные потолки', notes: [['Полотно разглаживается на скролле', 50, 30], ['Кнопка открывает 3D-примерку', 50, 82], ['Вызов замерщика → Telegram', 91, 8]] },
    { img: '/shots/mebel-hero.webp', name: 'Форма и шпон — мебель', notes: [['Заголовок под размеры клиента', 50, 22], ['Лента работ тянется мышью', 30, 72], ['Запись в шоурум → Telegram', 93, 8]] },
  ];
  const marks = document.getElementById('marks'), legend = document.getElementById('legend');
  const svg = document.getElementById('svg'), sheet = document.getElementById('sheet'), shot = document.getElementById('shot'), stamp = document.getElementById('stamp');
  const tabs = [...document.querySelectorAll('.tab')];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
  function blueprint(site) {
    svg.textContent = '';
    let d = 0;
    const path = (p, cls = 's') => { const e = el('path', { d: p, class: cls }); e.style.setProperty('--d', d++); svg.appendChild(e); };
    // page frame, nav, hero blocks
    path('M0 0H1600V1000H0Z');
    path('M0 90H1600');
    path('M60 45h120M1300 30h240v30h-240z');
    path('M520 45h90M640 45h90M760 45h90M880 45h90');
    path('M400 470h800M330 560h940M560 650h480');
    path('M560 740h220v56h-220zM820 740h220v56h-220z');
    path('M0 900H1600');
    // dimension lines (orange): width, height, CTA
    const dim = (p) => path(p, 's dim');
    dim('M0 -50H1600M0 -62v24M1600 -62v24');
    dim('M-60 0V1000M-72 0h24M-72 1000h24');
    dim('M560 830h220M560 818v24M780 818v24');
    const t = (txt, x, y, cls = 'lbl', anchor = 'middle') => { const e = el('text', { x, y, class: cls, 'text-anchor': anchor }); e.textContent = txt; e.style.setProperty('--d', d++); svg.appendChild(e); };
    t('1440 px', 800, -70); t('900', -84, 510, 'lbl', 'end'); t('CTA', 670, 880);
    svg.querySelectorAll('path').forEach((p) => p.style.setProperty('--len', Math.ceil(p.getTotalLength() + 2)));
  }
  let i = 0, timers = [];
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  function show(n, manual) {
    clear();
    i = (n + SITES.length) % SITES.length;
    const s = SITES[i];
    tabs.forEach((t, k) => { t.setAttribute('aria-selected', k === i); const bar = t.querySelector('i'); bar.style.transition = 'none'; bar.style.width = k < i ? '100%' : '0'; });
    sheet.classList.add('out');
    timers.push(setTimeout(() => {
      sheet.className = 'sheet';
      blueprint(s);
      shot.style.backgroundImage = `url(${s.img})`;
      marks.innerHTML = s.notes.map(([, x, y], k) => `<span class="mk" style="left:${x}%;top:${y}%;--d:${k}">${k + 1}</span>`).join('');
      legend.innerHTML = s.notes.map(([txt], k) => `<li><b>${k + 1}</b>${txt}</li>`).join('');
      legend.classList.remove('on'); setTimeout(() => legend.classList.add('on'), 900);
      stamp.innerHTML = `лист ${i + 1}/3 · <b>${s.name}</b><br>масштаб 1:1 · заявка → Telegram`;
      void sheet.offsetWidth;
      sheet.classList.add('on');
      if (reduced) { sheet.classList.add('built'); return; }
      timers.push(setTimeout(() => sheet.classList.add('built'), 2100));
      const bar = tabs[i].querySelector('i');
      requestAnimationFrame(() => { bar.style.transition = 'width 7s linear'; bar.style.width = '100%'; });
      if (!manual || true) timers.push(setTimeout(() => show(i + 1), 7000));
    }, 450));
  }
  tabs.forEach((t) => t.addEventListener('click', () => show(+t.dataset.i, true)));
  show(0);
})();
</script>
</body>
</html>
