<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TURCH — концепция C: «Сайт, который продаёт …»</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@600;800&family=Onest:wght@400;500;600&family=Spectral:ital,wght@1,300;1,500&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #0d0c0b; --tx: #f1ece3; --tx-2: rgba(241,236,227,.62); --accent: #ff6b1a; --ease: cubic-bezier(.16,1,.3,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--tx); font-family: 'Onest', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: relative; min-height: 100svh; overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 26px clamp(16px, 4vw, 56px); position: relative; z-index: 3; }
  .mark { font: 800 20px 'Commissioner'; letter-spacing: .1em; }
  .tg { font: 600 15px 'Onest'; color: #1b0a02; background: var(--accent); text-decoration: none; padding: 11px 18px; border-radius: 999px; }

  .arch { position: absolute; z-index: 1; right: clamp(16px, 6vw, 110px); top: 96px; height: calc(100svh - 214px); max-width: 42vw; aspect-ratio: 3 / 4; border-radius: 999px 999px 18px 18px; overflow: hidden; background: #1a1816; box-shadow: 0 60px 120px -40px rgba(0,0,0,.8); }
  .layer { position: absolute; inset: 0; background: center / cover no-repeat; clip-path: circle(0% at 50% 100%); transition: clip-path 1.1s var(--ease); }
  .layer.on { clip-path: circle(150% at 50% 100%); }
  .layer.under { clip-path: circle(150% at 50% 100%); transition: none; }
  .arch figcaption { position: absolute; left: 18px; right: 18px; bottom: 16px; display: flex; justify-content: space-between; font: 500 13px 'Onest'; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.6); z-index: 2; }

  .copy { position: relative; z-index: 2; align-self: center; padding: 0 clamp(16px, 4vw, 56px); max-width: 56vw; }
  .l1 { font: 800 clamp(40px, 5.6vw, 96px)/.95 'Commissioner'; letter-spacing: -.04em; margin: 0; max-width: 12ch; }
  .l2 { display: block; font: 300 italic clamp(64px, 10.5vw, 184px)/1 'Spectral'; letter-spacing: -.03em; color: var(--accent); height: 1.12em; overflow: hidden; white-space: nowrap; margin-top: -.06em; }
  .ch { display: inline-block; transform: translateY(105%); transition: transform .75s var(--ease); }
  .ch.in { transform: none; }
  .ch.out { transform: translateY(-105%); transition-duration: .45s; transition-timing-function: cubic-bezier(.7,0,.84,0); }
  .sub { max-width: 30rem; margin: 26px 0 0; color: var(--tx-2); font-size: clamp(16px, 1.3vw, 19px); line-height: 1.55; }
  .foot { position: relative; z-index: 2; display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; justify-content: space-between; padding: 22px clamp(16px, 4vw, 56px) 30px; border-top: 1px solid rgba(241,236,227,.12); }
  .cta { display: inline-flex; align-items: center; height: 54px; padding: 0 26px; border-radius: 999px; background: var(--tx); color: var(--bg); font: 600 16px 'Onest'; text-decoration: none; }
  .dots { display: flex; gap: 22px; font: 500 14px 'Onest'; color: var(--tx-2); }
  .dots button { all: unset; cursor: pointer; padding: 6px 0; border-bottom: 2px solid transparent; transition: color .3s, border-color .3s; }
  .dots button[aria-current="true"] { color: var(--tx); border-color: var(--accent); }
  .dots button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

  @media (max-width: 900px) { .copy { max-width: none; } .arch { position: relative; right: auto; top: auto; height: auto; max-width: none; width: auto; margin: 10px 16px 0; aspect-ratio: 4 / 3.2; border-radius: 200px 200px 16px 16px; } .stage { grid-template-rows: auto auto auto auto; } .copy { padding-top: 26px; } }
  @media (prefers-reduced-motion: reduce) { .ch, .layer { transition: none !important; } }
</style>
</head>
<body>
<main class="stage">
  <header><div class="mark">TURCH</div><a class="tg" href="https://t.me/Turch_I">Написать</a></header>
  <figure class="arch" aria-hidden="true">
    <div class="layer" style="background-image:url(/img/remont/hero.webp)"></div>
    <div class="layer" style="background-image:url(/img/potolki/lines.webp)"></div>
    <div class="layer" style="background-image:url(/img/mebel/closet-dark.webp)"></div>
    <div class="layer" style="background-image:url(/shots/remont-hero.webp)"></div>
    <figcaption><span id="cap">КЛЮЧ · ремонт</span><span>демо-сайт</span></figcaption>
  </figure>
  <section class="copy">
    <h1 class="l1">Сайт, который продаёт<span class="l2" id="word" aria-live="polite"></span></h1>
    <p class="sub">Делаю сайты для мастерских и подрядчиков: дорогие на вид, понятные клиенту и с заявками сразу в Telegram.</p>
  </section>
  <div class="foot">
    <a class="cta" href="https://t.me/Turch_I">Обсудить сайт</a>
    <nav class="dots" aria-label="Ниши" id="dots"></nav>
  </div>
</main>
<script>
(() => {
  const WORDS = [['ремонт', 'КЛЮЧ · ремонт квартир'], ['потолки', 'Глянец · натяжные потолки'], ['мебель', 'Форма и шпон · мебель'], ['ваше дело', 'Ваш бизнес · следующий']];
  const word = document.getElementById('word'), cap = document.getElementById('cap'), dots = document.getElementById('dots');
  const layers = [...document.querySelectorAll('.layer')];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  WORDS.forEach(([w], k) => { const b = document.createElement('button'); b.textContent = w; b.onclick = () => { manual = true; show(k); }; dots.appendChild(b); });
  let i = -1, t = 0, manual = false;
  function setWord(w) {
    const old = [...word.children];
    old.forEach((c, k) => { c.style.transitionDelay = k * 18 + 'ms'; c.classList.remove('in'); c.classList.add('out'); });
    setTimeout(() => {
      word.textContent = '';
      [...w].forEach((ch, k) => { const s = document.createElement('span'); s.className = 'ch'; s.textContent = ch === ' ' ? ' ' : ch; s.style.transitionDelay = k * 34 + 'ms'; word.appendChild(s); });
      word.setAttribute('aria-label', w);
      requestAnimationFrame(() => requestAnimationFrame(() => word.querySelectorAll('.ch').forEach((c) => c.classList.add('in'))));
    }, old.length ? 420 : 0);
  }
  function show(n) {
    clearTimeout(t);
    const prev = i; i = n;
    setWord(WORDS[i][0]);
    cap.textContent = WORDS[i][1];
    [...dots.children].forEach((b, k) => b.setAttribute('aria-current', k === i));
    layers.forEach((l, k) => { l.classList.remove('under'); if (k === prev) l.classList.add('under'); l.classList.toggle('on', k === i); l.style.zIndex = k === i ? 2 : k === prev ? 1 : 0; });
    if (!reduced) t = setTimeout(() => show((i + 1) % WORDS.length), manual ? 6000 : 3200);
  }
  show(0);
})();
</script>
</body>
</html>
